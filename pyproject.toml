[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-template"
version = "0.1.0"
description = "A production-shaped LangGraph AI agent template with a middleware engine, stateless HITL, and MCP-sourced tools"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Vipul Dhaigude"}
]
keywords = ["ai-agent", "langgraph", "mcp", "bedrock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    # Version bounds match the reference project's own tested pins
    # (its uv.lock), not just "latest that resolves" — mcp 2.0 in
    # particular is a breaking change from what langchain-mcp-adapters
    # 0.3.x and this template's MCP client code actually expect.
    "langchain>=1.3.14,<1.4",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint>=4.1.1,<5",
    # Two model providers, both core deps — a plain `pip install -e .` must
    # work for either without a separate extras step. OpenAI is the default
    # (AGENT_MODEL_PROVIDER=openai, zero-config beyond an API key); Bedrock
    # is recommended for production since AgentCore memory, Bedrock
    # Guardrails, Bedrock Knowledge Base, and CloudWatch/ADOT observability
    # all require it regardless of which provider is selected (see
    # CLAUDE.md "Cloud coupling") — opt-in via AGENT_MODEL_PROVIDER=bedrock.
    "langchain-aws>=1.5.0,<2",
    "langchain-openai>=1.0,<2",
    "boto3>=1.43,<2",
    # MCP client — tools are sourced from the companion mcp-server-template.
    "mcp>=1.27.1,<2",
    "langchain-mcp-adapters>=0.3.0,<0.4",
    "httpx>=0.28,<0.29",
    "tenacity>=9.1,<10",
    # AgentCore-backed persistence (Task 12) — pinned to the reference's
    # exact tested version; a known compatibility issue with LangGraph
    # interrupt pending-writes at other versions is why the checkpointer
    # (not the store) stays opt-in-off by default even when configured.
    "langgraph-checkpoint-aws==1.0.7",
    # Observability (Task 13) — AWS Distro for OpenTelemetry (ADOT). Always
    # installed (small, pure-Python SDK packages) even though tracing itself
    # is feature-flagged off by default — matches the reference, which
    # doesn't make these optional either.
    "aws-opentelemetry-distro>=0.17.1,<0.18",
    "opentelemetry-api>=1.40.0,<2",
    "opentelemetry-sdk>=1.40.0,<2",
    # Orchestration tool (Task 17) — RestrictedPython exec harness for
    # run_orchestration's local, in-process sandbox.
    "RestrictedPython>=7.4,<9",
]

[project.optional-dependencies]
cloudwatch = [
    # CloudWatch Logs shipping — optional because it pulls in a separate
    # logging-handler dependency for a feature most local/dev setups won't
    # use; ADOT tracing above ships unconditionally instead since it's
    # lightweight and feature-flagged either way.
    "watchtower>=3.4.0,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
ai-agent-template = "ai_agent_template.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app/ai_agent_template"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
